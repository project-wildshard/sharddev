packages:
  - .
# GVS G9 (J230): installs link into pnpm's global virtual store. confirmModulesPurge: false
# lets an existing classic checkout move over on a non-TTY install.
enableGlobalVirtualStore: true
confirmModulesPurge: false
packageExtensions:
  'postprocessing':
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
  'n8ao':
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
  'navcat':
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
