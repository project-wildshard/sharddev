# NPM-PUBLISH (meta docs/plans/NPM-PUBLISH-PLAN.md; Jake 2026-11-12: "publish stuff to npm so it can be installed
# without git links"). A vX.Y.Z release tag publishes @wildshard/sdk (this repo's package name since SHARD-AUTHORING
# SA7a, J317) to npm by trusted publishing (OIDC): no token is stored anywhere, and npm attaches the provenance itself.
# npm adds a trusted publisher only to a package that already exists; Jake published the README-only 0.0.0 placeholder
# and trusted this repo and workflow (NP5). The job reads the name from package.json, so it skips with a notice only if
# that name is not on npm. A manual run with placeholder=true publishes a README-only 0.0.x from this same file, so
# it proves the trusted publisher end to end without a release (NPM-PUBLISH smoke row).
name: npm-publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      placeholder:
        description: Publish a README-only placeholder of the package (no repo files)
        type: boolean
        default: false
      version:
        description: The placeholder version, always 0.0.x
        type: string
        default: 0.0.1

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use an npm that can publish by OIDC
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" ||
            npm install --global npm@11.16.0
          npm --version
      - name: Pack and verify both packages from the exact tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2016 # The quoted JavaScript reads the environment itself.
          node -e 'if (process.env.RELEASE_TAG !== `v${require("./package.json").version}`) throw new Error("Tag and package version differ")'
          node scripts/release-workspace.mjs pack "$RUNNER_TEMP/workspace-release"
      - name: Publish kit, then SDK
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const artifacts = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'workspace-release/release-artifacts.json'), 'utf8'));
          for (const item of artifacts) {
            try { execFileSync('npm', ['view', item.name, 'version'], { stdio: 'pipe' }); }
            catch { throw new Error(`${item.name} needs its initial package and npm publisher configuration before this release`); }
            try { execFileSync('npm', ['view', `${item.name}@${item.version}`, 'version'], { stdio: 'pipe' }); console.log(`${item.name}@${item.version} already published`); continue; }
            catch {}
            execFileSync('npm', ['publish', item.archive, '--provenance', '--access', 'public', '--ignore-scripts'], { stdio: 'inherit' });
          }
          NODE

  placeholder:
    # Only main's copy of this file: the trusted publisher is bound to the file name, not the branch.
    if: github.event_name == 'workflow_dispatch' && inputs.placeholder && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '@wildshard/kit'
            description: 'Shared creature content and helpers for the one shard format.'
          - name: '@wildshard/sdk'
            description: 'The Wildshard author SDK and the wildshard CLI for building shards.'
    env:
      NAME: ${{ matrix.name }}
      DESCRIPTION: ${{ matrix.description }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use an npm that can publish by OIDC
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" ||
            npm install --global npm@11.16.0
          npm --version
      - name: Write a package.json and README only
        run: |
          mkdir "$RUNNER_TEMP/placeholder"
          # shellcheck disable=SC2016 # the quoted script is JavaScript with template literals
          node -e '
          const fs = require("node:fs");
          const [dir, name, version, description, repo] = process.argv.slice(1);
          if (!/^0\.0\.[0-9]+$/.test(version)) throw new Error(`a placeholder version is 0.0.x, not ${version}`);
          const pkg = { name, version, description: `Placeholder. ${description}`, license: "UNLICENSED",
            repository: { type: "git", url: `git+https://github.com/${repo}.git` }, publishConfig: { access: "public" } };
          fs.writeFileSync(`${dir}/package.json`, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync(`${dir}/README.md`, [`# ${name}`, "", "Placeholder. The first real release publishes from CI.", "", description, "",
            `This ${version} was published by GitHub Actions with provenance from https://github.com/${repo}`,
            "(`npm-publish.yml`) to prove trusted publishing before a real release depends on it. Don\x27t install 0.0.x.", ""].join("\n"));
          ' "$RUNNER_TEMP/placeholder" "$NAME" "$VERSION" "$DESCRIPTION" "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/placeholder/package.json" "$RUNNER_TEMP/placeholder/README.md"
      - name: Publish the placeholder, unless it is already out
        working-directory: ${{ runner.temp }}/placeholder
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm."
            exit 0
          fi
          # A placeholder becomes latest (so the npm page shows its README) only while latest is a placeholder too.
          latest=$(npm view "$NAME" dist-tags.latest)
          tag=latest
          [[ "$latest" =~ ^0\.0\.[0-9]+$ ]] || tag=placeholder
          npm publish --provenance --access public --ignore-scripts --tag "$tag"
