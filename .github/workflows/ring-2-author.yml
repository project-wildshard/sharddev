name: ring-2-author

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ring-2-author.yml'
      - 'packages/**'
      - '.github/actions/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'public/**'
      - 'drafts/**'
      - 'lint/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.*'
      - '.npmrc'
      - '.gitattributes'
      - '.oxlintrc.author.json'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      engine:
        description: Exact engine candidate commit (empty keeps the pin)
        type: string
        default: ''

      browser_only:
        description: Diagnose packed browsers only (does not qualify full Ring 2)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ring-2-author-${{ github.ref }}-${{ inputs.engine }}-${{ inputs.browser_only || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node scripts/select-candidate.mjs
      # Select pnpm installer layout without changing the runner CI environment.
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Prove the installed global store layout
        run: node scripts/assert-store-layout.mjs
      - name: Ring 2 cold and relocated complete template bakes
        working-directory: packages/sdk
        if: ${{ !inputs.browser_only }}
        run: node --test --test-concurrency=1 ../dev/test/ci/template-determinism.test.mjs
      - name: Installed reference, door, save and real cook
        working-directory: packages/sdk
        if: ${{ !inputs.browser_only }}
        run: node --test --test-concurrency=1 ../dev/test/ci/new-reference.test.mjs
      - name: Installed generated author inputs and maps
        working-directory: packages/sdk
        if: ${{ !inputs.browser_only }}
        run: node --test --test-concurrency=1 ../dev/test/ci/author-inputs.test.mjs
      - name: Installed warm author build with OS networking denied
        working-directory: packages/sdk
        if: ${{ !inputs.browser_only }}
        run: node --test --test-concurrency=1 ../dev/test/ci/offline-author.test.mjs
      # TC14: report for one real week before explicit blocking admission.
      # Cold published client download + native browser are Ring 2, never hooks.
      - name: Observe packed outside-author browser boot
        working-directory: packages/sdk
        # Three cases (play, default reference, explore since EX6), each with a
        # 120 s test budget, plus the browser install: 4 minutes fit only two.
        timeout-minutes: 8
        if: always()
        continue-on-error: true
        env:
          WS_PROOF_SCRATCH: ${{ github.workspace }}/tmp/outside-browser
          WS_BROWSER_REPORT: ${{ github.workspace }}/tmp/outside-browser-report
        run: |
          pnpm --dir ../dev exec playwright install --with-deps chromium
          node --test ../dev/test/ci/outside-browser.proof.mjs
      - name: Retain outside-author browser observation
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outside-author-browser
          path: tmp/outside-browser-report
          if-no-files-found: warn
