name: ci

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      engine:
        description: Exact candidate engine commit (empty keeps the pin)
        type: string
        default: ''
  repository_dispatch:
    types: [engine-candidate]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.engine || github.event.client_payload.engine }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # FAST-RELEASE FR1 (meta docs/plans/FAST-RELEASE-PLAN.md): a release branch's one commit only stamps versions and adds
  # notes on a cut whose main `ci` passed, so check and products reuse that run (SDK 0.4.32 reran them: 21.5 min).
  # src/scripts/release-reuse.mjs proves it from git and the Actions API, or answers reuse=false and the full suite runs.
  # packed-install, the exact-SHA release proof, always runs. Main never runs this job, so main waits on nothing.
  release-gate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.gate.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/scripts/release-reuse.mjs ci

  check:
    needs: release-gate
    if: ${{ !cancelled() && needs.release-gate.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 5 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node src/scripts/select-candidate.mjs
      # pnpm disables GVS when its own ci option is true. Keep the runner CI
      # environment and frozen policy; select only the installer layout here.
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/npm-bin-deps
          key: npr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bin-deps/package.json', '.bin-deps/package-lock.json') }}
      - run: pnpm exec npr install --frozen
      - run: node src/scripts/.kit/bin-pins.mjs
      - name: Prove the installed global store layout
        run: node src/scripts/.kit/assert-store-layout.mjs
      # The same members as pnpm check bar check:watch-build (a GPU and a devserver client: pre-push only); author tests run in products.
      - run: node scripts/check-lift-review.mjs
        working-directory: packages/sdk
      - run: pnpm typecheck
      - name: Admit all restored CI21 source cases and compiler assertions
        run: |
          pnpm exec npr tsc -p packages/sdk/test/ci21-source/tsconfig.json
          cd packages/sdk
          node scripts/ci21-source-lint.mjs
          pnpm exec vitest run --config vitest.ci21-source.config.ts --reporter=default --reporter=json --outputFile=tmp/ci21-source/report.json
      - name: Retain raw default CI21 source verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci21-sdk-source-${{ github.run_id }}
          path: packages/sdk/tmp/ci21-source/report.json
          if-no-files-found: error
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:kit
      # SP21's output controls name their cook/game doubles. SP20c3 also
      # composes the actual sandboxed cook, signed parent and local game host.
      - name: Check out the async API contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-wildshard/api-server
          ref: 5a099e0bba64dccf304fcbeb0933ca2fe9f69294 # api-server v0.34.4 (format 0.71.0)
          path: tmp/codex-wire/api-contract-source
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false
      - name: Install the pinned API contract
        run: pnpm --dir tmp/codex-wire/api-contract-source install --ignore-workspace --frozen-lockfile --config.ci=false
      - name: Prove async upload with the real API and PGlite
        working-directory: packages/sdk
        env:
          WILDSHARD_API_SOURCE: ${{ github.workspace }}/tmp/codex-wire/api-contract-source
        run: node --test --test-concurrency=1 ../dev/test/ci/async-upload.test.mjs ../dev/test/ci/async-upload-parent.test.mjs
      - run: pnpm check:asks
      - name: The release gate's rules and its place in this workflow (FAST-RELEASE FR1)
        run: node --test src/test/release-reuse.test.mjs
      # The agent hook scripts are shellchecked at this exact version
      # (.agents/hooks/test/shellcheck.test.mjs refuses any other on CI).
      # MR6: hosted runners are Linux/X64, the Mac mini's VM is Linux/ARM64;
      # each archive is pinned by its own published sha256.
      - name: Install shellcheck 0.11.0
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) arch=x86_64 sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            Linux/ARM64) arch=aarch64 sum=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
            *) echo "::error::no pinned shellcheck 0.11.0 for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.xz"
          echo "$sum  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: pnpm check:agent-sync
      - run: pnpm test:agent-hooks
      - run: pnpm check:parity
      - run: pnpm exec vitest run --config test/ci/generation-cache.vitest.mjs
        working-directory: packages/build
      - run: node --test ../dev/test/ci/generation-cli.test.mjs
        working-directory: packages/sdk
      - name: Installed keyed sky codec and worker byte contracts
        working-directory: packages/sdk
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --test ../dev/test/ci/keyed-sky-codec.test.mjs
      - name: Installed interaction placement author contracts
        working-directory: packages/sdk
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --test ../dev/test/ci/interaction-placement.test.mjs
      - name: Installed map author ownership and legacy pixels
        working-directory: packages/sdk
        run: node --test ../dev/test/ci/map-author.test.mjs
      - name: Installed navigation author and real queries
        working-directory: packages/sdk
        run: node --test ../dev/test/ci/navigation-author.test.mjs
      - name: Public headless observation and worker ownership
        working-directory: packages/sdk
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --test ../dev/test/ci/headless-observation.test.mjs
      - name: Public numeric output and refusal contracts
        working-directory: packages/sdk
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --test ../dev/test/ci/channel-values.test.mjs
      - run: pnpm test:ci
      # SDK-SPLIT SP11: the dependency guard fails when build, kit, sdk or upload reaches the engine or a dev tool.
      - name: Dependency guard (strict for the lean packages)
        run: node --test test/ci/dep-guard.test.mjs && node src/scripts/dep-guard.mjs
      # Meta SHARD-DELETE DEL6: the operator's account key, for uploads from
      # CI. The repo secret WILDSHARD_API_KEY is set by hand (Jake); until it
      # is, this step only notes it is missing. whoami prints the key's first
      # characters, never the whole key.
      - name: The account key reaches the CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WILDSHARD_API_KEY: ${{ secrets.WILDSHARD_API_KEY }}
        run: |
          if [ -z "$WILDSHARD_API_KEY" ]; then
            echo '::notice::No WILDSHARD_API_KEY secret yet (meta SHARD-DELETE DEL6)'
          else
            node packages/dev/bin/wildshard.mjs whoami
          fi
      - name: Name the commits this verdict covers
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### CI verdict target\n\n%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[] | select(.status == \"completed\" and .conclusion != \"cancelled\" and .id < $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished push run to compare against' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA?per_page=100" \
            --jq '.commits[] | "\(.sha[0:10]) \(.commit.message | split("\n")[0])"')
          {
            printf '\n### Included commits since %s\n\n~~~text\n%s\n~~~\n' "$previous" "$commits"
            echo 'The checks target the final tree; intermediate SHAs were not executed separately.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Keep the Playwright runner on the known Ubuntu 24.04 image.
  # Browser E2E serves its own workspace and needs no output from the
  # product proofs. Give it a runner of its own under the same deadlines.
  # The product suite runs 11 min on a normal runner and went past 15 on
  # slow ones (runs 45439889036, 45489963164: cancelled mid-proof, nothing
  # red), so a push gets PRODUCTS_PUSH_MINUTES (test/ci-products-deadline).
  products:
    needs: release-gate
    if: ${{ !cancelled() && needs.release-gate.outputs.reuse != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [product, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 8 || 25 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node src/scripts/select-candidate.mjs
      # pnpm disables GVS when its own ci option is true. Keep the runner CI
      # environment and frozen policy; select only the installer layout here.
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/npm-bin-deps
          key: npr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bin-deps/package.json', '.bin-deps/package-lock.json') }}
      - run: pnpm exec npr install --frozen
      - run: node src/scripts/.kit/bin-pins.mjs
      - name: Prove the installed global store layout
        run: node src/scripts/.kit/assert-store-layout.mjs
      # SDK-SPLIT SP9d3: dev's `wildshard build` runs build's compiled bin (dist/build.mjs), as an installed build does.
      - name: Compile the build bin
        run: pnpm --filter @wildshard/build compile
      - name: Author tests
        if: matrix.suite == 'product'
        run: pnpm test:author
      - name: Build the owned templates
        if: ${{ !cancelled() && matrix.suite == 'product' }}
        run: pnpm build:shards
      - name: Preserve CI21 grid eviction and restore assertions
        if: ${{ !cancelled() && matrix.suite == 'product' }}
        working-directory: packages/sdk
        run: |
          mkdir -p tmp/ci21-grid
          node --test test/ci21-grid-reentry.test.mjs > tmp/ci21-grid/raw.tap
          cat tmp/ci21-grid/raw.tap
      - name: Keep actual grid owner results
        if: always() && matrix.suite == 'product'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci21-grid-owner-${{ github.job }}-${{ github.run_id }}
          path: packages/sdk/tmp/ci21-grid/
          if-no-files-found: ignore
      # TEMPLATE-E2E TR-11 (J434): Mossgate, the starter, took the retired Template's play proofs. It is a source shard
      # that build:shards does not list, so it builds on its own and WS_MOSSGATE_OUT hands it to the proofs below.
      - name: Build Mossgate
        working-directory: packages/sdk
        if: ${{ !cancelled() && matrix.suite == 'product' }}
        run: node ../dev/bin/wildshard.mjs build src/shards/mossgate tmp/ci-mossgate/mossgate
      - name: Walk the owned 1800-tick authored route
        working-directory: packages/sdk
        if: ${{ !cancelled() && matrix.suite == 'product' }}
        env:
          WS_MOSSGATE_OUT: tmp/ci-mossgate/mossgate
        run: node --test ../dev/test/ci/owned-journey.test.mjs
      - name: Installed author and template play proofs
        working-directory: packages/sdk
        if: ${{ !cancelled() && matrix.suite == 'product' }}
        env:
          WS_MOSSGATE_OUT: tmp/ci-mossgate/mossgate
        run: node --test --test-concurrency=1 ../dev/test/ci/installed-author.test.mjs ../dev/test/ci/template-play.test.mjs ../dev/test/ci/mossgate-warden.test.mjs ../dev/test/ci/mossgate-chest.test.mjs ../dev/test/ci/package-products.test.mjs
      # The headless shell only, no --with-deps: the runner image carries
      # Chromium's system libraries, and the apt half fetched 32 MB of fonts
      # at 86 kB/s for 6 min on 2026-11-18 (run 44387745051), past the cap.
      - name: Install Chromium
        working-directory: packages/dev
        if: ${{ !cancelled() }}
        run: pnpm exec playwright install --only-shell chromium
      - name: End-to-end
        if: ${{ !cancelled() && matrix.suite == 'browser' }}
        run: pnpm test:e2e
      # MEMORY-STRUCTURE STR10, MEMORY-GATES MG2: the phone memory probe a shard repo runs, booted online with the
      # local Node world and no in-page server, on the starter (an under-line control).
      - name: Online phone memory reading of Mossgate
        working-directory: packages/sdk
        if: ${{ !cancelled() && matrix.suite == 'product' }}
        run: node ../dev/bin/wildshard.mjs memory tmp/ci-mossgate/mossgate
      - if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: packages/dev/src/e2e/test-results/
          retention-days: 7

  packed-install:
    # SP23 proves the release graph. Candidate engine jobs keep their own proofs.
    if: ${{ !(inputs.engine || github.event.client_payload.engine) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Pack the release graph
        run: |
          pnpm install --frozen-lockfile --config.ci=false
          node src/scripts/release-workspace.mjs pack "$RUNNER_TEMP/workspace-release"
          cp src/scripts/verify-packed-install.mjs "$RUNNER_TEMP/verify-packed-install.mjs"
      - name: Install and run the CLI outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          # SHARD-COMPAT CP18: a release also typechecks one real shard on the packed graph.
          WS_REAL_SHARD: ${{ startsWith(github.ref, 'refs/heads/release/') && 'project-wildshard/shard-mirror-salt' || '' }}
        run: node verify-packed-install.mjs workspace-release "$(command -v pnpm)"
