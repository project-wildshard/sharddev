name: ci

on:
  push:
    branches: [main, 'plan/**']
  pull_request:
  workflow_dispatch:
    inputs:
      engine:
        description: Exact candidate engine commit (empty keeps the pin)
        type: string
        default: ''
  repository_dispatch:
    types: [engine-candidate]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.engine || github.event.client_payload.engine }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 5 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node scripts/select-candidate.mjs
      # pnpm disables GVS when its own ci option is true. Keep the runner CI
      # environment and frozen policy; select only the installer layout here.
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Prove the installed global store layout
        run: node scripts/assert-store-layout.mjs
      # The same members as pnpm check; author tests run in products.
      - run: node scripts/check-lift-review.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:kit
      - run: pnpm check:asks
      # The agent hook scripts are shellchecked at this exact version
      # (.agents/hooks/test/shellcheck.test.mjs refuses any other on CI).
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: pnpm check:agent-sync
      - run: pnpm test:agent-hooks
      - run: pnpm check:parity
      - run: pnpm exec vitest run --config test/ci/generation-cache.vitest.mjs
      - run: node --test test/ci/generation-cli.test.mjs
      - name: Installed keyed sky codec and worker byte contracts
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/keyed-sky-codec.test.mjs
      - name: Installed interaction placement author contracts
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/interaction-placement.test.mjs
      - name: Installed map author ownership and legacy pixels
        run: node --test test/ci/map-author.test.mjs
      - name: Installed navigation author and real queries
        run: node --test test/ci/navigation-author.test.mjs
      - name: Public headless observation and worker ownership
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/headless-observation.test.mjs
      - name: Public numeric output and refusal contracts
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/channel-values.test.mjs
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pnpm test:hooks
      - run: pnpm test:ci
      # Meta SHARD-DELETE DEL6: the operator's account key, for uploads from
      # CI. The repo secret WILDSHARD_API_KEY is set by hand (Jake); until it
      # is, this step only notes it is missing. whoami prints the key's first
      # characters, never the whole key.
      - name: The account key reaches the CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WILDSHARD_API_KEY: ${{ secrets.WILDSHARD_API_KEY }}
        run: |
          if [ -z "$WILDSHARD_API_KEY" ]; then
            echo '::notice::No WILDSHARD_API_KEY secret yet (meta SHARD-DELETE DEL6)'
          else
            node bin/wildshard.mjs whoami
          fi
      - name: Name the commits this verdict covers
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### CI verdict target\n\n%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[] | select(.status == \"completed\" and .conclusion != \"cancelled\" and .id < $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished push run to compare against' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA?per_page=100" \
            --jq '.commits[] | "\(.sha[0:10]) \(.commit.message | split("\n")[0])"')
          {
            printf '\n### Included commits since %s\n\n~~~text\n%s\n~~~\n' "$previous" "$commits"
            echo 'The checks target the final tree; intermediate SHAs were not executed separately.'
          } >> "$GITHUB_STEP_SUMMARY"

  # TS16c (meta TEST-SPEED): author tests, products and e2e share one job,
  # so the install is paid once. Pinned: Playwright 1.60 can't install
  # Chromium on ubuntu-latest (26.04).
  # A candidate run gets 8 minutes here, not 5: three former jobs run in turn.
  products:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 8 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node scripts/select-candidate.mjs
      # pnpm disables GVS when its own ci option is true. Keep the runner CI
      # environment and frozen policy; select only the installer layout here.
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile --config.ci=false
          else
            pnpm install --frozen-lockfile --config.ci=false
          fi
      - name: Prove the installed global store layout
        run: node scripts/assert-store-layout.mjs
      - name: Author tests
        run: pnpm test:author
      - name: Build all three owned templates
        if: ${{ !cancelled() }}
        run: pnpm build:shards
      - name: Walk the owned 1800-tick authored route
        if: ${{ !cancelled() }}
        run: node --experimental-transform-types --test test/ci/owned-journey.test.mjs
      - name: Installed author and template play proofs
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 test/ci/installed-author.test.mjs test/ci/template-play.test.mjs test/ci/package-products.test.mjs
      - name: Install Chromium for e2e
        if: ${{ !cancelled() }}
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end
        if: ${{ !cancelled() }}
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: src/e2e/test-results/
          retention-days: 7
