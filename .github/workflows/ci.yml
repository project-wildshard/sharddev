name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engine:
        description: Exact candidate engine commit (empty keeps the pin)
        type: string
        default: ''
  repository_dispatch:
    types: [engine-candidate]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.engine || github.event.client_payload.engine }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 5 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi
      # The same members as pnpm check; author tests run in their own job.
      - run: node scripts/check-lift-review.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:kit
      - run: pnpm check:asks
      - run: pnpm exec vitest run --config test/ci/generation-cache.vitest.mjs
      - run: node --test test/ci/generation-cli.test.mjs
      - name: Installed keyed sky codec and worker byte contracts
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/keyed-sky-codec.test.mjs
      - name: Installed interaction placement author contracts
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/interaction-placement.test.mjs
      - name: Installed map author ownership and legacy pixels
        run: node --test test/ci/map-author.test.mjs
      - name: Installed navigation author and real queries
        run: node --test test/ci/navigation-author.test.mjs
      - name: Public headless observation and worker ownership
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/headless-observation.test.mjs
      - name: Public numeric output and refusal contracts
        run: node --import @wildshard/engine/scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/channel-values.test.mjs
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pnpm test:hooks
      - run: pnpm test:ci
      - name: Name the commits this verdict covers
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### CI verdict target\n\n%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[] | select(.status == \"completed\" and .conclusion != \"cancelled\" and .id < $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished push run to compare against' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA?per_page=100" \
            --jq '.commits[] | "\(.sha[0:10]) \(.commit.message | split("\n")[0])"')
          {
            printf '\n### Included commits since %s\n\n~~~text\n%s\n~~~\n' "$previous" "$commits"
            echo 'The checks target the final tree; intermediate SHAs were not executed separately.'
          } >> "$GITHUB_STEP_SUMMARY"

  author-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 5 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi
      - run: pnpm test:author --shard=${{ matrix.shard }}

  products:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 5 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact engine candidate
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine || github.event.client_payload.engine }}
        run: |
          if [ -n "$CANDIDATE_ENGINE" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi
      - name: Build all three owned templates
        run: pnpm build:shards
      - name: Walk the owned 1800-tick authored route
        run: node --experimental-transform-types --test test/ci/owned-journey.test.mjs
      - name: Installed author and template play proofs
        run: node --test --test-concurrency=1 test/ci/installed-author.test.mjs test/ci/template-play.test.mjs test/ci/package-products.test.mjs

  e2e:
    # Pinned: Playwright 1.60 can't install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 5 || 15 }}
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
