name: ci21-sdk-source

# C2 originals report outside hooks during the J186 advisory week.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - lint/**
      - test/ci21-source/**
      - test/fixtures/ci21-*/**
      - scripts/ci21-*.mjs
      - scripts/check-model-sources.mjs
      - scripts/gen-shards.mjs
      - scripts/push-tables.mjs
      - scripts/blender/**
      - src/scripts/.kit/bin-tools.mjs
      - .github/workflows/ci21-sdk-source.yml
      - package.json
      - pnpm-lock.yaml
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      engine:
        description: Immutable engine commit with the discovery scheduler export
        type: string
        required: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      CANDIDATE_ENGINE: ${{ inputs.engine || '8762a373db80d2710e454a9ba699beb4547d0882' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select the immutable engine graph
        run: node src/scripts/select-candidate.mjs
      - name: Install candidate graph
        run: pnpm install --no-frozen-lockfile --config.ci=false
      - name: Install the frozen native tool pins
        run: pnpm exec npr install --frozen
      - name: Compile the complete author project and source ports
        run: pnpm exec npr tsc -p packages/sdk/test/ci21-source/tsconfig.json
      - name: Apply actual typed author lint
        working-directory: packages/sdk
        run: node scripts/ci21-source-lint.mjs
      - name: Run every source case and retain actual results
        working-directory: packages/sdk
        run: |
          mkdir -p tmp/ci21-source
          pnpm exec vitest run --config vitest.ci21-source.config.ts --reporter=json --outputFile=tmp/ci21-source/results.json
      - name: Retain actual source verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci21-sdk-source-${{ github.sha }}
          path: packages/sdk/tmp/ci21-source/*.json
          if-no-files-found: error
          retention-days: 14
